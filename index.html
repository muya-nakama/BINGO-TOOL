<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b1b23"><title>ビンゴ抽選ツール</title><link rel="stylesheet" href="css/style.css"></head><body><main class="wrap"><header><h1>ビンゴ抽選ツール</h1><p>木製回転抽籤器</p></header><section class="settings"><label for="maximum">最大値（1〜9999）</label><input id="maximum" type="number" min="1" max="9999" step="1" value="75" inputmode="numeric"><button id="apply">設定</button><button id="mute" type="button" aria-pressed="false">音 ON</button></section><section class="machine" aria-label="木製のビンゴ抽選機"><div class="cage-frame"><div id="drum" class="drum"><div class="drum-inner"><span class="bead b1">8</span><span class="bead b2">15</span><span class="bead b3">24</span><span class="bead b4">39</span><span class="bead b5">61</span><span class="bead b6">72</span><i class="shaft"></i></div><div class="drum-rim"></div></div><div class="legs"><i></i><i></i></div><div class="crank"><i></i></div><div class="chute"></div><div class="base"></div></div><div class="ball-area"><div id="ball" class="result-ball empty" aria-live="polite">?</div></div><p id="status">次の番号は？</p></section><section class="actions"><button id="draw" type="button">抽選する</button><p id="message" aria-live="polite"></p><div class="count" id="counter">抽選済み 0 / 75 ・ 残り 75</div><div class="progress" id="progress" role="progressbar" aria-label="抽選進捗" aria-valuemin="0" aria-valuemax="75" aria-valuenow="0"><div id="bar"></div></div></section><section class="history-card"><div class="history-head"><h2>抽選履歴 <span id="count">(0)</span></h2><button id="clear" type="button">履歴をクリア</button></div><div class="numbers" id="history"><p>まだ抽選されていません。</p></div></section></main><script src="js/audio-data.js"></script><script src="js/script.js" defer></script></body></html>
